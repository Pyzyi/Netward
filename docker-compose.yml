# Netward – Netzwerk-Wächter für dein Heimnetz.
# ZimaOS: App Store → „+“ → „Benutzerdefinierte App installieren“ → „Importieren“ → diese Datei einfügen.
# Andere Systeme: `docker compose up -d`, danach http://<server-ip>:8840 öffnen.
name: netward

services:
  netward:
    image: ghcr.io/pyzyi/netward:latest
    container_name: netward
    restart: unless-stopped
    # Layer-2-Scans (ARP, DHCP, mDNS) funktionieren nur im Netzwerk des Hosts.
    network_mode: host
    # Minimale Rechte: Netward öffnet damit seine Sockets und gibt danach
    # alle Rechte ab (läuft als UID 10001 ohne Capabilities).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_RAW
      # Optional, nur für Stolperdraht-Köder auf Ports unter 1024 (NETWARD_TRIPWIRE_PORTS):
      # - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      TZ: Europe/Berlin
      NETWARD_PORT: "8840"
      # Optional: zusätzliche Hostnamen hinter einem Reverse-Proxy
      # NETWARD_ALLOWED_HOSTS: netward.example.com
      # Optional: Stolperdraht-Köder auf Ports unter 1024 (braucht NET_BIND_SERVICE oben)
      # NETWARD_TRIPWIRE_PORTS: "23,445"
    volumes:
      - /DATA/AppData/netward:/data
    x-casaos:
      envs:
        - container: TZ
          description:
            de_de: Zeitzone
            en_us: Time zone
        - container: NETWARD_PORT
          description:
            de_de: Port der Weboberfläche
            en_us: Web UI port
      volumes:
        - container: /data
          description:
            de_de: Datenbank und Sicherungen
            en_us: Database and backups

x-casaos:
  architectures:
    - amd64
    - arm64
  main: netward
  author: Pyzyi
  developer: Netward
  category: Network
  icon: https://raw.githubusercontent.com/Pyzyi/Netward/main/web/public/icon-512.png
  tagline:
    de_de: Jedes Gerät in deinem Netz im Blick
    en_us: Every device on your network at a glance
  description:
    de_de: Netward erkennt alle Geräte im Heimnetz, zeigt wer online ist, meldet neue Geräte und prüft das Netz auf typische Schwachstellen. Ohne Cloud, ohne Abo.
    en_us: Netward discovers every device on your home network, shows who is online, alerts you about new devices and checks the network for common weaknesses. No cloud, no subscription.
  title:
    de_de: Netward
    en_us: Netward
  index: /
  port_map: "8840"
  scheme: http
