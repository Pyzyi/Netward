# Netward as a TrueNAS SCALE custom app (24.10 "Electric Eel" and newer).
# Apps → Discover Apps → ⋮ → Install via YAML → name "netward" → paste this file.
# Create the data folder first and adjust the path below to your pool.
services:
  netward:
    image: ghcr.io/pyzyi/netward:latest
    container_name: netward
    restart: unless-stopped
    # Layer-2 discovery (ARP, DHCP, mDNS) only works on the host network.
    network_mode: host
    # Used only during start-up; Netward then switches to PUID:PGID and
    # drops every capability.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      TZ: Etc/UTC
      NETWARD_PORT: "8840"
      # 568 is the "apps" user of TrueNAS, so the dataset stays readable for other apps.
      PUID: "568"
      PGID: "568"
    volumes:
      - /mnt/tank/apps/netward:/data
