TZ: Europe/Berlin

netzwart:
  interfaces: ""
  additional_envs:
    - name: NETZWART_LOG_LEVEL
      value: debug

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8841

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true

labels: []

resources:
  limits:
    cpus: 2.0
    memory: 512
