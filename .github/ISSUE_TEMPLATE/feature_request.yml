name: Feature idea
description: Suggest an improvement / Verbesserung vorschlagen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the situation and the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could Netzwart help?
