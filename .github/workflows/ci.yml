name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go – lint, test, fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          GOFMT="$(go env GOROOT)/bin/gofmt"
          bad="$("$GOFMT" -l $(git ls-files '*.go'))"
          for f in $bad; do
            diff="$("$GOFMT" -d "$f" | head -c 3000)"
            diff="${diff//'%'/'%25'}"; diff="${diff//$'\n'/'%0A'}"
            echo "::error file=$f::not gofmt-formatted%0A$diff"
          done
          test -z "$bad"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: PDF tools (the report test checks its output with qpdf)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qpdf poppler-utils
      - name: Tests (race detector)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Fuzzing (short)
        run: make fuzz FUZZTIME=15s
      - name: Vulnerability snapshot matches its sources (KEV, CVE List at fixed commits)
        run: go run ./tools/kevgen -verify internal/vuln/kev.json

  govulncheck:
    name: Go – known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: go.mod
          go-package: ./...

  web:
    name: Web – types, contrast, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - name: WCAG contrast of the design tokens
        run: npm run contrast
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high
      - name: No raw HTML rendering in components
        run: '! grep -rn "{@html" src'

  container:
    name: Container – build, integration, UI, scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: netzwart:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls netzwart:ci
      - name: Integration tests (privileges, ownership, discovery, API, update from the last release)
        run: sudo --preserve-env=GITHUB_ACTIONS e2e/container-test.sh netzwart:ci ghcr.io/${GITHUB_REPOSITORY,,}:latest
      - name: Start demo instance
        run: |
          docker run -d --name netzwart-demo --network host \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add NET_RAW \
            --security-opt no-new-privileges:true --read-only \
            -e NETZWART_DEMO=1 -e NETZWART_PORT=18850 -e TZ=Europe/Berlin \
            netzwart:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18850/healthz >/dev/null && exit 0
            sleep 1
          done
          docker logs netzwart-demo; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install browser for the UI tests
        working-directory: e2e
        timeout-minutes: 15
        run: |
          npm ci --no-fund
          npx playwright install --with-deps chromium
      - name: UI tests (Playwright, desktop + mobile)
        working-directory: e2e
        env:
          NETZWART_URL: http://127.0.0.1:18850
        timeout-minutes: 10
        run: |
          npx playwright test
      - name: Container logs
        if: failure()
        run: docker logs netzwart-demo || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: netzwart:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # A release happens when VERSION on main names a version without a tag yet:
  # this run then publishes the image as that version and "latest", and the
  # release job creates the tag and the GitHub release. Pushing a v* tag by
  # hand still works as before.
  version:
    name: Release check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        run: |
          v="$(tr -d ' \n\r' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION '$v' is not x.y.z"; exit 1; }
          # A version tag is only ever published from a commit on main.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1
          fi
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # Only "tag not found" (exit 2) means a new release; any other
            # failure must not re-publish an existing version.
            rc=0; git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null || rc=$?
            case $rc in
              0) ;;
              2) [ -f "docs/releases/v$v.md" ] || { echo "::error::release notes docs/releases/v$v.md missing"; exit 1; }
                 release=true ;;
              *) echo "::error::cannot check tag v$v (git ls-remote exit $rc)"; exit 1 ;;
            esac
          fi
          { echo "version=$v"; echo "minor=${v%.*}"; echo "release=$release"; } >> "$GITHUB_OUTPUT"
          echo "VERSION $v, release: $release"

  publish:
    name: Publish image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [go, govulncheck, web, container, version]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # "latest" is the newest release, not the newest commit: main builds
          # are published as "edge". No bare major tag while still at 0.x.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) }}
            type=edge,branch=main
            type=sha,format=short
      # The Dockerfile cross-compiles on the build platform, so no QEMU is needed.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: GitHub release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [version, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release from docs/releases/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "::error::release notes $notes missing"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          args=()
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          # From main the release creates its tag on this commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" "${args[@]}" --title "Netzwart ${TAG#v}" --notes-file "$notes"
