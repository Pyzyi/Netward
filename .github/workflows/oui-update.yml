name: Update vendor database

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  oui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download IEEE registry mirror
        run: |
          mkdir -p "$RUNNER_TEMP/oui" && cd "$RUNNER_TEMP/oui"
          npm pack oui-data --silent
          tar xzf oui-data-*.tgz
      - name: Regenerate table
        run: |
          go run ./tools/ouigen -in "$RUNNER_TEMP/oui/package/index.json" -out internal/oui/oui.tsv.gz
          go test ./internal/oui
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/oui-update
          commit-message: 'chore(oui): update vendor database'
          title: 'chore(oui): update vendor database'
          body: Weekly refresh of the embedded IEEE OUI table (MA-L, MA-M, MA-S).
          delete-branch: true
